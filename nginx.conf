server {
    listen       ${PORT:-8080};
    listen       [::]:${PORT:-8080};
    server_name  _;

    root   /app/dist;  # ← измените здесь!

    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    error_page 404 /index.html;
}