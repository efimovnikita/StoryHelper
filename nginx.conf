server {
    listen       ${PORT:-8080};
    listen       [::]:${PORT:-8080};
    server_name  _;

    root   /app/dist;   # ← обязательно! Здесь файлы из GCS

    index  index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html =404;  # добавьте =404 для явной ошибки
    }

    # Опционально: логи для дебага
    error_log /dev/stderr warn;
    access_log /dev/stdout combined;

    # Кэширование и т.д. как раньше
}